# Lean quality gates — local auto-fixers + fast checks.
# `pre-commit run --all-files` is the gate-1/gate-5 entrypoint used by the lean
# CI (.github/workflows/quality.yml -> QZP reusable-quality.yml). Every rev is
# pinned; bump versions here together with the QZP lean charter.
#
# Charter lane 1 (lint+format+imports, AUTOFIX): Ruff lint+format [py] + Oxlint [ts/js].
# Charter lane 5 (secrets): gitleaks over the working tree.
# (black / eslint-classic are retired by the lean charter; ruff-format and oxlint
#  replace them as the deterministic local tools.)
#
# NOTE (DRAFT gap): the charter ts/js FORMATTER (Oxfmt / Biome) is intentionally
# NOT wired yet. The UI is currently formatted with Prettier; adopting a new
# formatter reflows ~100 files, deferred to a dedicated follow-up so this additive
# PR carries no unreviewable formatting churn. Oxlint (lint) is wired now.
minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3

exclude: |-
  (?x)^(
    node_modules/|
    ui/node_modules/|
    ui/dist/|
    dist/|
    build/|
    out/|
    vendor/|
    \.venv/|
    backend/\.venv/|
    .*\.egg-info/|
    backend/alembic/versions/
  )

repos:
  # --- Gate 1: Python lint + format (ruff 0.15.17) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        name: ruff (lint --fix)
        args: ["--fix", "--config", "backend/pyproject.toml"]
        files: '^backend/.*\.py$'
      - id: ruff-format
        name: ruff (format)
        args: ["--config", "backend/pyproject.toml"]
        files: '^backend/.*\.py$'

  # --- Gate 1: JS/TS lint (oxlint 1.69.0 mirror) ---
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.69.0
    hooks:
      - id: oxlint
        name: oxlint (ui)
        args: ["--fix", "--deny-warnings"]
        files: '^ui/src/.*\.(ts|tsx|js|jsx)$'

  # --- Gate 5: secrets (gitleaks 8.30.1) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secrets)
        args: ["--config", ".gitleaks.toml"]
