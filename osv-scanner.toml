# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The gate runs osv-scanner over the lockfiles and must report 0 actionable CVEs.
#
# POLICY: ignore entries are allowed ONLY for a genuinely-unfixable vuln (no
# non-breaking upgrade) OR one that is provably not reachable in THIS product,
# each with a reason + dated review note (greppable). We do NOT use a baseline
# file — clean-zero is reached by upgrading where a safe fix exists, and only by
# a reasoned per-CVE ignore where it does not.
#
# Lockfiles scanned (recursive from repo root):
#   - backend/requirements.txt      (FastAPI/SQLAlchemy Python backend deps)
#   - backend/requirements-dev.txt  (Python backend dev/test deps)
#   - ui/package-lock.json          (React/Vite TypeScript UI npm tree)
#
# ---------------------------------------------------------------------------
# GAP CLOSED (2026-06-20): the actionable CVEs noted earlier (axios,
# react-router, vite, vitest, esbuild, form-data, ws, @babel/core, js-yaml
# [npm] and starlette, python-multipart, pyjwt, pygments, mako, idna,
# cryptography [PyPI]) were cleared by UPGRADING the lockfiles (commit
# df0045d "fix(deps): upgrade Python + npm deps to clear osv-scanner CVEs"),
# NOT by suppression. osv-scanner 2.3.8 over backend/requirements.txt,
# backend/requirements-dev.txt and ui/package-lock.json now reports
# "No issues found" — the lean `quality` deps gate is clean-zero with no
# IgnoredVulns entries. Add a dated, reasoned IgnoredVulns entry below only
# for a future vuln that is genuinely unfixable or provably unreachable — do
# NOT use ignores to paper over an available upgrade.
# ---------------------------------------------------------------------------
