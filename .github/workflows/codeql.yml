name: CodeQL

# Fleet CODEQL DECISION: ADVANCED configuration, owned by THIS repo.
#   queries: security-extended + security-and-quality (strictly subsumes the
#   default suite AND the extended suite), matrix over every language this
#   repo actually has (python in backend/, typescript in ui/), push to main +
#   pull_request targeting main + weekly schedule, upload-sarif to code
#   scanning, category per language. The repo's OWN suites (ci.yml,
#   quality.yml) stay wired beside it and are untouched by this file.
#
# This replaces the QZP reusable-codeql.yml@bf487f2 call, which ran the
# security-and-quality suite ONLY -- every security-extended query was missing.
# build-mode: none -- this CodeQL CLI supports no other mode for the Python
# and JavaScript/TypeScript extractors.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
