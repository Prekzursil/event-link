name: CodeQL

# Fleet CODEQL DECISION: ADVANCED configuration, owned by THIS repo.
#   queries: security-extended + security-and-quality (strictly subsumes the
#   default suite AND the extended suite), every language this repo actually
#   has (python in backend/, javascript-typescript in ui/, actions for
#   .github/workflows/*), push to main + pull_request targeting main +
#   weekly schedule, upload-sarif to code scanning. The repo's OWN suites
#   (ci.yml, quality.yml) stay wired beside it and are untouched here.
#
# Shape notes, all measured on the fleet (Star-Wars PR #45):
# - build-mode: none -- the only mode this CodeQL CLI supports for these
#   extractors.
# - the analyze job CHECKS OUT THE PR HEAD: analyses key to the checkout,
#   and the required-results rule expects the head SHA (merge-commit
#   checkouts left merges blocked: uploads landed on refs/pull/N/merge).
# - job id `codeql` and NO explicit category: the required-results rule
#   tracks the wrapper-era analysis_key+category
#   (.github/workflows/codeql.yml:codeql); explicit /language:* categories
#   left merges blocked. Auto-derived categories keep that contract.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript,actions
          build-mode: none
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
