version: 2
updates:
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
